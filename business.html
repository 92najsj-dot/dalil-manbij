<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#176b50">
<title>صفحة المحل | دليل منبج</title>
<meta name="description" content="صفحة المحل ومعلومات التواصل والإعلانات على دليل منبج.">
<style>
:root{--green:#176b50;--line:#dfe9e3;--muted:#617368;--bg:#f5f8f6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#20372b;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}a{color:inherit}.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 16px}.topin{max-width:1000px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:22px;font-weight:900;color:var(--green);text-decoration:none}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fff;text-decoration:none;font-weight:700;cursor:pointer}.primary{background:var(--green);border-color:var(--green);color:white}.wrap{max-width:1000px;margin:22px auto;padding:0 14px}.status{padding:16px;background:#fff;border:1px solid var(--line);border-radius:14px;color:var(--muted)}.shop{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.cover{min-height:160px;background:linear-gradient(135deg,#d8efe2,#f4f9f5);display:flex;align-items:center;justify-content:center;font-size:64px}.cover img{width:100%;max-height:330px;object-fit:cover}.body{padding:20px}.titleline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.titleline h1{margin:0;font-size:clamp(24px,4vw,34px)}.verified{background:#e2f6e9;color:#176b50;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:800}.meta{color:var(--muted);line-height:1.9;margin:10px 0}.desc{line-height:1.9;white-space:pre-wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:26px 0 12px}.sectionhead h2{margin:0;font-size:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.photo{height:160px;background:#eaf2ed;display:flex;align-items:center;justify-content:center;font-size:44px}.photo img{width:100%;height:100%;object-fit:cover}.cardbody{padding:13px}.card h3{margin:0 0 8px;font-size:17px}.price{color:var(--green);font-weight:900;font-size:18px}.small{color:var(--muted);font-size:13px;line-height:1.8}.footer{text-align:center;padding:28px 12px;color:var(--muted);font-size:13px}.hoursbox{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:13px;background:#f9fcfa}.openbadge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:800}.openbadge.open{background:#e2f6e9;color:#176b50}.openbadge.closed{background:#fff0d8;color:#80510c}.hoursrows{display:grid;gap:8px;margin-top:10px}.hourrow{display:grid;grid-template-columns:90px 1fr 1fr auto;align-items:center;gap:8px;font-size:13px}.hourrow input{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px;background:white}.hourrow label{display:flex;gap:5px;align-items:center}@media(max-width:560px){.hourrow{grid-template-columns:72px 1fr 1fr}.hourrow label{grid-column:1/-1}}@media(max-width:480px){.body{padding:15px}.cover{min-height:120px}.actions .btn{flex:1}.grid{grid-template-columns:1fr 1fr}.photo{height:115px}.cardbody{padding:10px}.card h3{font-size:14px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><a class="brand" href="index.html">📍 دليل منبج</a><a class="btn" href="index.html#businesses">رجوع لدليل المحلات</a></div></header>
<main class="wrap">
<div id="status" class="status">عم نحمل صفحة المحل…</div>
<section id="shop" class="shop" hidden></section>
<div class="sectionhead"><h2>🛍️ إعلانات صاحب المحل</h2><span class="small">الإعلانات المنشورة فقط</span></div>
<div id="listings" class="grid"><div class="status">عم نحمل الإعلانات…</div></div>
</main>
<footer class="footer">دليل منبج · من أهل منبج وريفها ولأهلها</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://keadoflmrwqpdjauzbhc.supabase.co';
const SUPABASE_KEY='sb_publishable_S2ytDQHuffiAdwk5-2Ckug_sO1jBg-G';
const $=id=>document.getElementById(id);
let currentUser=null, shopOwnerId=null;
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits=v=>String(v||'').replace(/[^0-9]/g,'').replace(/^00/,'');
function images(v){if(Array.isArray(v))return v;if(typeof v==='string'){try{const x=JSON.parse(v);return Array.isArray(x)?x:[]}catch(_){return v.startsWith('http')?[v]:[]}}return []}
function photo(v,cover){const a=images(v),u=cover||a[0];return u?'<div class="cover"><img src="'+esc(u)+'" alt="غلاف المحل" loading="lazy"></div>':'<div class="cover">🏪</div>'}
function listingPhoto(v){const a=images(v);return a.length?'<div class="photo"><img src="'+esc(a[0])+'" alt="" loading="lazy"></div>':'<div class="photo">🛍️</div>'}
const DAY_KEYS=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];const DAY_LABELS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];let shopHoursCache={};
function normalizedHours(raw){let src=raw&&typeof raw==='object'&&!Array.isArray(raw)?raw:{};let out={};DAY_KEYS.forEach((key,i)=>{let row=src[key]||src[String(i)]||src[DAY_LABELS[i]]||{};out[key]={closed:row.closed===true||row.is_closed===true,open:String(row.open||row.from||row.start||''),close:String(row.close||row.to||row.end||'')}});return out}
function currentOpenState(raw){const h=normalizedHours(raw),now=new Date(),day=DAY_KEYS[now.getDay()],r=h[day];if(!r||r.closed||!r.open||!r.close||!/^\d{2}:\d{2}$/.test(r.open)||!/^\d{2}:\d{2}$/.test(r.close))return {known:false,open:false};const n=now.getHours()*60+now.getMinutes(),a=Number(r.open.slice(0,2))*60+Number(r.open.slice(3)),b=Number(r.close.slice(0,2))*60+Number(r.close.slice(3));const open=b<a?(n>=a||n<b):(n>=a&&n<b);return {known:true,open}}
function renderServices(values){const arr=Array.isArray(values)?values.filter(Boolean):[];return arr.length?'<div class="meta"><strong>🧰 الخدمات:</strong> '+arr.map(esc).join(' · ')+'</div>':''}
function renderOpeningHours(raw,isOwner,id){const h=normalizedHours(raw),state=currentOpenState(h);shopHoursCache=h;let badge=state.known?'<span class="openbadge '+(state.open?'open':'closed')+'">'+(state.open?'● مفتوح الآن':'● مغلق الآن')+'</span>':'<span class="openbadge closed">◷ أوقات الدوام غير محددة</span>';let editor='';if(isOwner){editor='<div id="hoursEditor" hidden><div class="hoursrows">'+DAY_KEYS.map((key,i)=>'<div class="hourrow"><strong>'+DAY_LABELS[i]+'</strong><label>من<input type="time" id="hours-open-'+key+'" value="'+esc(h[key].open)+'"></label><label>إلى<input type="time" id="hours-close-'+key+'" value="'+esc(h[key].close)+'"></label><label><input type="checkbox" id="hours-closed-'+key+'" '+(h[key].closed?'checked':'')+'> مغلق</label></div>').join('')+'</div><div class="actions"><button class="btn primary" type="button" onclick="saveShopHours(\''+esc(id)+'\')">حفظ أوقات الدوام</button><button class="btn" type="button" onclick="document.getElementById(\'hoursEditor\').hidden=true">إلغاء</button></div></div><button class="btn" type="button" style="margin-top:10px" onclick="document.getElementById(\'hoursEditor\').hidden=false">✏️ تعديل أوقات الدوام</button>'}return '<div class="hoursbox"><strong>🕒 أوقات الدوام</strong><div style="margin-top:8px">'+badge+'</div>'+editor+'</div>'}
async function saveShopHours(id){if(!currentUser||!shopOwnerId||String(currentUser.id)!==String(shopOwnerId)){alert('تعديل أوقات الدوام متاح لصاحب المحل فقط.');return}const h={};DAY_KEYS.forEach(key=>{h[key]={open:document.getElementById('hours-open-'+key).value,close:document.getElementById('hours-close-'+key).value,closed:document.getElementById('hours-closed-'+key).checked}});for(const key of DAY_KEYS){const r=h[key];if(!r.closed&&((r.open&&!r.close)||(!r.open&&r.close))){alert('أكمل وقت الفتح والإغلاق أو فعّل خيار مغلق لكل يوم.');return}}const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const res=await db.from('businesses').update({opening_hours:h}).eq('id',id).eq('owner_id',currentUser.id).select('id');if(res.error||!res.data||!res.data.length){console.error('save shop hours',res.error);alert('تعذّر حفظ الدوام. تأكد من صلاحيات صاحب المحل في قاعدة البيانات.');return}alert('تم حفظ أوقات الدوام.');location.reload()}
async function run(){
 const id=new URLSearchParams(location.search).get('id');
 if(!id){$('status').textContent='رابط المحل غير مكتمل. ارجع إلى دليل المحلات واختر محلاً.';$('listings').innerHTML='';return}
 try{
  const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const r=await db.from('businesses').select('id,owner_id,name,description,phone,whatsapp,website_url,address,area,village,map_url,category_id,status,is_featured,is_verified,image_urls,cover_image_url,logo_url,opening_hours,services,created_at').eq('id',id).eq('status','active').maybeSingle();
  if(r.error)throw r.error;
  const x=r.data;
  if(!x){$('status').textContent='المحل غير موجود أو لم يعد منشوراً.';$('listings').innerHTML='';return}
  document.title=x.name+' | دليل منبج';
  shopOwnerId=x.owner_id;
  const sessionResult=await db.auth.getSession();
  currentUser=sessionResult.data&&sessionResult.data.session?sessionResult.data.session.user:null;
  const isOwner=!!(currentUser&&String(currentUser.id)===String(x.owner_id));
  const contact=x.whatsapp||x.phone, wa=digits(contact);
  $('status').hidden=true;$('shop').hidden=false;
  $('shop').innerHTML=photo(x.image_urls,x.cover_image_url)+'<div class="body"><div class="titleline">'+(x.logo_url?'<img src="'+esc(x.logo_url)+'" alt="شعار '+esc(x.name)+'" style="width:62px;height:62px;object-fit:contain;border-radius:13px;border:1px solid var(--line);background:#fff">':'')+'<h1>'+esc(x.name)+'</h1>'+(x.is_verified?'<span class="verified">✓ محل موثّق</span>':'')+'</div><div class="meta">📍 '+esc([x.area,x.village,x.address].filter(Boolean).join(' · ')||'منبج وريفها')+'</div>'+(x.description?'<div class="desc">'+esc(x.description)+'</div>':'')+renderServices(x.services)+renderOpeningHours(x.opening_hours,isOwner,x.id)+'<div class="actions">'+(wa?'<a class="btn primary" href="https://wa.me/'+wa+'?text='+encodeURIComponent('السلام عليكم 🌿، شفت محل '+(x.name||'محلكم')+' على دليل منبج، وحابب استفسر عن خدماتكم. ممكن تفاصيل أكثر لو سمحتوا؟ يعطيكم العافية 🤍')+'" target="_blank" rel="noopener noreferrer">تواصل عبر واتساب</a>':'')+(x.phone?'<a class="btn" href="tel:'+esc(x.phone)+'">اتصال</a>':'')+(x.map_url?'<a class="btn" href="'+esc(x.map_url)+'" target="_blank" rel="noopener noreferrer">عرض الموقع على الخريطة</a>':'')+(x.website_url?'<a class="btn" href="'+esc(x.website_url)+'" target="_blank" rel="noopener noreferrer">موقع المحل</a>':'')+(isOwner?'<button class="btn primary" type="button" onclick="window.location.href=\'index.html?publish=listing#listings\'">➕ نشر إعلان من داخل المحل</button>':'')+'<button class="btn" type="button" onclick="shareShop()">مشاركة صفحة المحل ↗</button></div></div>';
  if(navigator.share){window.shareShop=()=>navigator.share({title:x.name+' | دليل منبج',text:'شوف صفحة '+x.name+' على دليل منبج',url:location.href}).catch(()=>{})}else{window.shareShop=async()=>{try{await navigator.clipboard.writeText(location.href);alert('تم نسخ رابط صفحة المحل')}catch(_){prompt('انسخ رابط صفحة المحل:',location.href)}}}
  const ads=await db.from('listings').select('id,user_id,title,description,price,currency,area,village,category,item_condition,contact_phone,image_urls,created_at,status').eq('user_id',x.owner_id).in('status',['active','approved','sold']).order('created_at',{ascending:false}).limit(60);
  if(ads.error)throw ads.error;
  const rows=ads.data||[];
  $('listings').innerHTML=rows.length?rows.map(a=>{
   const ownerControls=isOwner?'<div class="actions"><button class="btn" type="button" onclick="editListingFromShop(\''+esc(a.id)+'\')">✏️ تعديل الإعلان</button>'+(a.status!=='sold'?'<button class="btn" type="button" onclick="markSoldFromShop(\''+esc(a.id)+'\')">✓ تم البيع</button>':'<button class="btn" type="button" onclick="markAvailableFromShop(\''+esc(a.id)+'\')">↩ إعادة تنشيط الإعلان</button>')+'<button class="btn" type="button" style="color:#a32626;border-color:#e8bebe" onclick="deleteListingFromShop(\''+esc(a.id)+'\')">🗑️ حذف الإعلان</button></div>':'';
   return `<article class="card">${listingPhoto(a.image_urls)}<div class="cardbody"><h3>${esc(a.title)}</h3><div class="price">${a.currency==='USD'?'USD':'ل.س'} ${Number(a.price||0).toLocaleString('en-US')}</div><div class="small">📍 ${esc([a.area,a.village].filter(Boolean).join(' · ')||'منبج وريفها')} · ${esc(a.category||'أخرى')}</div>${a.status==='sold'?'<div class="verified" style="display:inline-block;margin:7px 0;background:#fff0d8;color:#80510c">✓ مباع</div>':''}${a.description?'<p class="small">'+esc(a.description.slice(0,140))+'</p>':''}${a.status!=='sold'&&a.contact_phone?'<a class="btn" href="https://wa.me/'+digits(a.contact_phone)+'" target="_blank" rel="noopener noreferrer">تواصل بخصوص الإعلان</a>':''}${ownerControls}</div></article>`;
  }).join(''):'<div class="status">ما في إعلانات بيع منشورة مرتبطة بحساب صاحب هذا المحل حالياً. إذا نشرت إعلاناً ولم يظهر، تأكد أنك نشرت من نفس الحساب الذي يملك المحل وأن الإعلان مقبول ومنشور.</div>';
 }catch(e){console.error(e);$('status').textContent='تعذّر تحميل الصفحة. تحقق من اتصال الإنترنت ثم أعد المحاولة.';$('listings').innerHTML=''}
}
async function deleteListingFromShop(id){
 if(!currentUser||!shopOwnerId||String(currentUser.id)!==String(shopOwnerId)){alert('حذف الإعلان متاح لصاحب المحل فقط.');return}
 if(!confirm('هل أنت متأكد من حذف هذا الإعلان نهائياً؟ لا يمكن التراجع عن الحذف.'))return;
 const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 const r=await db.from('listings').delete().eq('id',id).eq('user_id',currentUser.id).select('id');
 if(r.error||!r.data||!r.data.length){console.error('delete listing:',r.error);alert('تعذّر حذف الإعلان. قد تكون صلاحيات الحذف غير مفعّلة في قاعدة البيانات.');return}
 alert('تم حذف الإعلان.');
 location.reload();
}
async function markSoldFromShop(id){
 if(!currentUser||!shopOwnerId||String(currentUser.id)!==String(shopOwnerId)){alert('هذا الخيار متاح لصاحب المحل فقط.');return}
 if(!confirm('تأكيد وضع الإعلان كـ «مباع»؟ سيظهر للزوار أنه مباع ولن يظهر زر التواصل.'))return;
 const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 const r=await db.from('listings').update({status:'sold'}).eq('id',id).eq('user_id',currentUser.id).select('id');
 if(r.error||!r.data||!r.data.length){alert('تعذّر تحديث الإعلان.');return}
 location.reload();
}
async function markAvailableFromShop(id){
 if(!currentUser||!shopOwnerId||String(currentUser.id)!==String(shopOwnerId))return;
 if(!confirm('إعادة الإعلان إلى الحالة المنشورة؟'))return;
 const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 const r=await db.from('listings').update({status:'active'}).eq('id',id).eq('user_id',currentUser.id).eq('status','sold').select('id');
 if(r.error||!r.data||!r.data.length){alert('تعذّر إعادة تنشيط الإعلان.');return}
 location.reload();
}
function editListingFromShop(id){
 if(!currentUser||!shopOwnerId||String(currentUser.id)!==String(shopOwnerId)){alert('سجّل الدخول بالحساب الذي يملك المحل لتعديل الإعلان.');return}
 location.href='index.html?editListing='+encodeURIComponent(id)+'#listings';
}

run();
</script>
</body>
</html>
